  none: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Nenhum vínculo do DiscordSRV encontrado <#868e96>(sem DiscordSRV ativo, accounts.aof ou armazenamento SQL)<#e7cfff>.'
