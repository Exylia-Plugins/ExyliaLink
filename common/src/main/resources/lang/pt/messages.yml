  warning-restricted:
    - '&r'
    - '[sound:block.note_block.pling|0.5|1.2;center]<#8a51c4>&lVÍNCULO OBRIGATÓRIO'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>%reason%'
    - ' <#a89ab5>▎ <#e7cfff>Alguns comandos ficam <#a33b53>bloqueados <#e7cfff>até vincular.'
    - '&r'
    - '<click:run_command:/link><hover:show_text:''<#e7cfff>Clique para obter o seu código''><#ff9500>➥ <#e7cfff>Clique aqui ou use <#59a4ff>/link <#e7cfff>para vincular o seu Discord</hover></click>'
