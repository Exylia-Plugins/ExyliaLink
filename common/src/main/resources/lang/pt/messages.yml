prefix: '{primary}&lLINK {letters_black}•<reset>'
link:
  code:
    - '&r'
    - '[center]<#8a51c4>&lVINCULE O SEU DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>O seu código <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Clique para copiar''><#ffd700>&l%code%</hover></click> <#868e96>(clique para copiar)'
    - ' <#a89ab5>▎ <#e7cfff>Use <#59a4ff>/link %code% <#e7cfff>no nosso Discord'
    - ' <#a89ab5>▎ <#e7cfff>ou insira-o em <click:open_url:%url%><hover:show_text:''<#e7cfff>Abrir a página de vínculo''><#59a4ff>%url%</hover></click>'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Expira em <#59a4ff>%time% ⌚'
    - '&r'
  redeemed: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Vinculado a <#ffd700>%discord%<#8fffc1>. Bem-vindo a bordo!'
  linked: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>A sua conta agora está vinculada a <#ffd700>%discord%<#8fffc1>.'
  unlinked: '[sound:block.note_block.bass|0.5|0.8]%prefix% <#e7cfff>A sua conta já não está vinculada ao Discord.'
  status-linked:
    - '&r'
    - '[center]<#8a51c4>&lVÍNCULO COM O DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Estado <#a89ab5>» <#8fffc1>Vinculado'
    - ' <#a89ab5>▎ <#e7cfff>Discord <#a89ab5>» <#ffd700>%discord%'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Use <#59a4ff>/unlink <#e7cfff>para removê-lo'
    - '&r'
  status-unlinked:
    - '&r'
    - '[center]<#8a51c4>&lVÍNCULO COM O DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Estado <#a89ab5>» <#868e96>Não vinculado'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Use <#59a4ff>/link <#e7cfff>para obter um código'
    - '&r'
  unlink-confirm:
    - '%prefix% <#e7cfff>Desvincular a sua conta de <#ffd700>%discord%<#e7cfff>?'
    - '<click:run_command:/unlink confirm><hover:show_text:''<#e7cfff>Desvincular agora''><#a33b53>&l[✔ DESVINCULAR]</hover></click> <#a89ab5>Tem <#59a4ff>30s ⌚ <#a89ab5>para confirmar.'
  unlink-done: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>A sua conta já não está vinculada.'
  not-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>A sua conta não está vinculada. Use <#59a4ff>/link <#e7cfff>para vinculá-la.'
errors:
  offline: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>O vínculo com o Discord está indisponível neste momento. <#e7cfff>Tente novamente daqui a pouco.'
  rate-limited: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Calma, tente novamente em <#59a4ff>%time% ⌚<#e7cfff>.'
  cooldown: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Poderá vincular de novo em <#59a4ff>%time% ⌚<#e7cfff>.'
  already-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Você já está vinculado. Use primeiro <#59a4ff>/unlink<#e7cfff>.'
  uuid-taken: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Você já está vinculado. Use primeiro <#59a4ff>/unlink<#e7cfff>.'
  discord-taken: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Essa conta do Discord já está vinculada <#e7cfff>a outra conta de Minecraft.'
  code-invalid: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Esse código não é válido. <#e7cfff>Use <#59a4ff>/link <#e7cfff>no Discord para obter um novo.'
  self-unlink-disabled: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Desvincular está desativado nesta rede. Fale com a equipa.'
  internal: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Algo correu mal <#868e96>(%error%)<#a33b53>. <#e7cfff>Tente novamente mais tarde.'
  players-only: '%prefix% <#e7cfff>Só jogadores podem fazer isso.'
  no-permission: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Você não tem permissão para fazer isso.'
admin:
  usage:
    - '&r'
    - '[center]<#8a51c4>&lEXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin connect <#a89ab5>» <#e7cfff>vincular a rede'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin status <#a89ab5>» <#e7cfff>ligação e rede'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin disconnect <#a89ab5>» <#e7cfff>esquecer a rede aqui'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin unlink <player> <#a89ab5>» <#e7cfff>desvincular alguém'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin import discordsrv <#a89ab5>» <#e7cfff>importar vínculos do DiscordSRV'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin reload <#a89ab5>» <#e7cfff>recarregar os ficheiros'
    - '&r'
  connect-code:
    - '&r'
    - '[center]<#8a51c4>&lLIGAR AO EXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Código <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Clique para copiar''><#ffd700>&l%code%</hover></click>'
    - ' <#a89ab5>▎ <#e7cfff>Aprove-o em <click:open_url:%url%><hover:show_text:''<#e7cfff>Abrir a página de aprovação''><#59a4ff>%url%</hover></click>'
    - ' <#a89ab5>▎ <#e7cfff>Expira em <#59a4ff>%time% ⌚'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Entre com o Discord, escolha a rede e aprove'
    - '&r'
  connect-waiting: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Já há um código de ligação à espera de aprovação.'
  connect-done:
    - '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Ligado a <#ffd700>%network%<#8fffc1>.'
    - '<#ff9500>➥ <#e7cfff>Use <#59a4ff>/linkadmin connect <#e7cfff>uma vez em cada um dos outros servidores e proxies da rede também.'
  connect-expired: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>O código expirou. Use <#59a4ff>/linkadmin connect <#e7cfff>novamente.'
  connect-failed: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Não foi possível contactar o Exylia Link. <#e7cfff>Tente novamente daqui a pouco.'
  status:
    - '&r'
    - '[center]<#8a51c4>&lEXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Ligação <#a89ab5>» %state%'
    - ' <#a89ab5>▎ <#e7cfff>Função <#a89ab5>» %role%'
    - ' <#a89ab5>▎ <#e7cfff>Rede <#a89ab5>» <#ffd700>%network%'
    - ' <#a89ab5>▎ <#e7cfff>ID do servidor <#a89ab5>» <#59a4ff>%server%'
    - ' <#a89ab5>▎ <#e7cfff>Latência <#a89ab5>» <#59a4ff>%latency%'
    - ' <#a89ab5>▎ <#e7cfff>Recompensas em curso <#a89ab5>» <#59a4ff>%rewards%'
    - ' <#a89ab5>▎ <#e7cfff>Último erro <#a89ab5>» <#868e96>%error%'
    - '&r'
  state-connected: '<#8fffc1>Ligado'
  state-connecting: '<#ff9500>A ligar…'
  state-not-linked: '<#868e96>Não vinculado'
  state-stopped: '<#a33b53>Atualize o ExyliaLink'
  role-proxy: '<#59a4ff>Proxy <#868e96>(fala com os jogadores)'
  role-backend: '<#59a4ff>Servidor de jogo'
  role-backend-behind-proxy: '<#59a4ff>Servidor de jogo <#868e96>(o proxy fala com os jogadores)'
  none: '—'
  disconnect-confirm:
    - '%prefix% <#e7cfff>Desligar <#ffd700>este servidor <#e7cfff>do Exylia Link? <#868e96>(os outros continuam ligados)'
    - '<click:run_command:/linkadmin disconnect confirm><hover:show_text:''<#e7cfff>Desligar agora''><#a33b53>&l[✔ DESLIGAR]</hover></click> <#a89ab5>Tem <#59a4ff>30s ⌚ <#a89ab5>para confirmar.'
  disconnected: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Desligado. <#e7cfff>O network.dat foi apagado neste servidor.'
  not-connected: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Este servidor não está ligado. Use <#59a4ff>/linkadmin connect<#e7cfff>.'
  unlink-done: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#ffd700>%player% <#8fffc1>foi desvinculado.'
  unlink-none: '[sound:entity.villager.no|0.6|1.0]%prefix% <#ffd700>%player% <#e7cfff>não estava vinculado.'
  player-not-found: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Nenhum jogador chamado <#ffd700>%player%<#a33b53>.'
  secret-revoked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>O Exylia Link revogou o segredo desta rede. <#e7cfff>Use <#59a4ff>/linkadmin connect <#e7cfff>para a ligar de novo.'
  protocol-refused: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>O Exylia Link já não aceita esta versão do ExyliaLink. <#e7cfff>Atualize o plugin.'
  reloaded: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>config.yml e as mensagens foram recarregados.'
  reload-failed: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Não foi possível recarregar: <#868e96>%error%'
importing:
