  available: '%prefix% <#e7cfff>O ExyliaLink <#8fffc1>%version% <#e7cfff>está disponível <#868e96>(em execução: %current%)<#e7cfff>. <click:open_url:%url%><hover:show_text:''<#e7cfff>Abrir a página da versão''><#59a4ff>&nTransferir</hover></click>'
