    - '[sound:entity.experience_orb.pickup|0.6|1.4;center]<#8a51c4>&lIMPORTAÇÃO DO DISCORDSRV CONCLUÍDA'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Vínculos lidos <#a89ab5>» <#59a4ff>%total%'
    - ' <#a89ab5>▎ <#e7cfff>Importados <#a89ab5>» <#8fffc1>%inserted%'
    - ' <#a89ab5>▎ <#e7cfff>Já vinculados <#a89ab5>» <#868e96>%skipped%'
    - ' <#a89ab5>▎ <#e7cfff>Conflitos <#a89ab5>» <#ff9500>%conflicts%'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Os conflitos estão listados no painel e na consola'
