    - '<click:run_command:/link><hover:show_text:''<#e7cfff>Clique para obter o seu código''><#ff9500>➥ <#e7cfff>Clique aqui ou use <#59a4ff>/link <#e7cfff>para vincular o seu Discord</hover></click>'
