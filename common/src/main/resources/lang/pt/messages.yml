  reminder: '%prefix% <#e7cfff>%reason% <click:run_command:/link><hover:show_text:''<#e7cfff>Clique para obter o seu código''><#59a4ff>&n/link</hover></click>'
  blocked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Vincule primeiro a sua conta do Discord. <click:run_command:/link><hover:show_text:''<#e7cfff>Clique para obter o seu código''><#e7cfff>Use <#59a4ff>/link <#e7cfff>para desbloquear este comando.</hover></click>'
