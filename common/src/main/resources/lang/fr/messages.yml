  warning:
    - '&r'
    - '[sound:block.note_block.pling|0.5|1.2;center]<#8a51c4>&lLIAISON REQUISE'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>%reason%'
    - '&r'
    - '<click:run_command:/link><hover:show_text:''<#e7cfff>Cliquez pour obtenir votre code''><#ff9500>➥ <#e7cfff>Cliquez ici ou tapez <#59a4ff>/link <#e7cfff>pour lier votre Discord</hover></click>'
    - '&r'
  warning-restricted:
    - '&r'
    - '[sound:block.note_block.pling|0.5|1.2;center]<#8a51c4>&lLIAISON REQUISE'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>%reason%'
    - ' <#a89ab5>▎ <#e7cfff>Certaines commandes restent <#a33b53>verrouillées <#e7cfff>tant que vous n''êtes pas lié.'
    - '&r'
    - '<click:run_command:/link><hover:show_text:''<#e7cfff>Cliquez pour obtenir votre code''><#ff9500>➥ <#e7cfff>Cliquez ici ou tapez <#59a4ff>/link <#e7cfff>pour lier votre Discord</hover></click>'
    - '&r'
  reminder: '%prefix% <#e7cfff>%reason% <click:run_command:/link><hover:show_text:''<#e7cfff>Cliquez pour obtenir votre code''><#59a4ff>&n/link</hover></click>'
  blocked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Liez d''abord votre compte Discord. <click:run_command:/link><hover:show_text:''<#e7cfff>Cliquez pour obtenir votre code''><#e7cfff>Tapez <#59a4ff>/link <#e7cfff>pour débloquer cette commande.</hover></click>'
update:
