prefix: '{primary}&lLINK {letters_black}•<reset>'
link:
  code:
    - '&r'
    - '[center]<#8a51c4>&lLIEZ VOTRE DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Votre code <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Cliquez pour copier''><#ffd700>&l%code%</hover></click> <#868e96>(cliquez pour copier)'
    - ' <#a89ab5>▎ <#e7cfff>Tapez <#59a4ff>/link %code% <#e7cfff>sur notre Discord'
    - ' <#a89ab5>▎ <#e7cfff>ou saisissez-le sur <click:open_url:%url%><hover:show_text:''<#e7cfff>Ouvrir la page de liaison''><#59a4ff>%url%</hover></click>'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Expire dans <#59a4ff>%time% ⌚'
    - '&r'
  redeemed: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Lié à <#ffd700>%discord%<#8fffc1>. Bienvenue à bord !'
  linked: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Votre compte est maintenant lié à <#ffd700>%discord%<#8fffc1>.'
  unlinked: '[sound:block.note_block.bass|0.5|0.8]%prefix% <#e7cfff>Votre compte n''est plus lié à Discord.'
  status-linked:
    - '&r'
    - '[center]<#8a51c4>&lLIAISON DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Statut <#a89ab5>» <#8fffc1>Lié'
    - ' <#a89ab5>▎ <#e7cfff>Discord <#a89ab5>» <#ffd700>%discord%'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Tapez <#59a4ff>/unlink <#e7cfff>pour le retirer'
    - '&r'
  status-unlinked:
    - '&r'
    - '[center]<#8a51c4>&lLIAISON DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Statut <#a89ab5>» <#868e96>Non lié'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Tapez <#59a4ff>/link <#e7cfff>pour obtenir un code'
    - '&r'
  unlink-confirm:
    - '%prefix% <#e7cfff>Délier votre compte de <#ffd700>%discord%<#e7cfff> ?'
    - '<click:run_command:/unlink confirm><hover:show_text:''<#e7cfff>Délier maintenant''><#a33b53>&l[✔ DÉLIER]</hover></click> <#a89ab5>Vous avez <#59a4ff>30s ⌚ <#a89ab5>pour confirmer.'
  unlink-done: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Votre compte n''est plus lié.'
  not-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Votre compte n''est pas lié. Tapez <#59a4ff>/link <#e7cfff>pour le lier.'
errors:
  offline: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>La liaison Discord est indisponible pour le moment. <#e7cfff>Réessayez dans un instant.'
  rate-limited: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Doucement, réessayez dans <#59a4ff>%time% ⌚<#e7cfff>.'
  cooldown: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Vous pourrez relier dans <#59a4ff>%time% ⌚<#e7cfff>.'
  already-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Vous êtes déjà lié. Tapez d''abord <#59a4ff>/unlink<#e7cfff>.'
  uuid-taken: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Vous êtes déjà lié. Tapez d''abord <#59a4ff>/unlink<#e7cfff>.'
  discord-taken: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Ce compte Discord est déjà lié <#e7cfff>à un autre compte Minecraft.'
  code-invalid: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Ce code n''est pas valide. <#e7cfff>Tapez <#59a4ff>/link <#e7cfff>sur Discord pour en obtenir un nouveau.'
  self-unlink-disabled: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>La déliaison est désactivée sur ce réseau. Contactez un membre du staff.'
  internal: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Une erreur est survenue <#868e96>(%error%)<#a33b53>. <#e7cfff>Réessayez plus tard.'
  players-only: '%prefix% <#e7cfff>Seuls les joueurs peuvent faire cela.'
  no-permission: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Vous n''avez pas la permission de faire cela.'
admin:
  usage:
    - '&r'
    - '[center]<#8a51c4>&lEXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin connect <#a89ab5>» <#e7cfff>lier le réseau'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin status <#a89ab5>» <#e7cfff>connexion et réseau'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin disconnect <#a89ab5>» <#e7cfff>oublier le réseau ici'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin unlink <player> <#a89ab5>» <#e7cfff>délier un joueur'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin import discordsrv <#a89ab5>» <#e7cfff>importer les liens DiscordSRV'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin reload <#a89ab5>» <#e7cfff>recharger les fichiers'
    - '&r'
  connect-code:
    - '&r'
    - '[center]<#8a51c4>&lCONNEXION À EXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Code <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Cliquez pour copier''><#ffd700>&l%code%</hover></click>'
    - ' <#a89ab5>▎ <#e7cfff>Approuvez-le sur <click:open_url:%url%><hover:show_text:''<#e7cfff>Ouvrir la page d''approbation''><#59a4ff>%url%</hover></click>'
    - ' <#a89ab5>▎ <#e7cfff>Expire dans <#59a4ff>%time% ⌚'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Connectez-vous avec Discord, choisissez le réseau et approuvez'
    - '&r'
  connect-waiting: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Un code de connexion attend déjà d''être approuvé.'
  connect-done:
    - '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Connecté à <#ffd700>%network%<#8fffc1>.'
    - '<#ff9500>➥ <#e7cfff>Tapez <#59a4ff>/linkadmin connect <#e7cfff>une fois sur chaque autre serveur et proxy du réseau aussi.'
  connect-expired: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Le code a expiré. Tapez à nouveau <#59a4ff>/linkadmin connect<#e7cfff>.'
  connect-failed: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Impossible de joindre Exylia Link. <#e7cfff>Réessayez dans un instant.'
  status:
    - '&r'
    - '[center]<#8a51c4>&lEXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Connexion <#a89ab5>» %state%'
    - ' <#a89ab5>▎ <#e7cfff>Rôle <#a89ab5>» %role%'
    - ' <#a89ab5>▎ <#e7cfff>Réseau <#a89ab5>» <#ffd700>%network%'
    - ' <#a89ab5>▎ <#e7cfff>ID du serveur <#a89ab5>» <#59a4ff>%server%'
    - ' <#a89ab5>▎ <#e7cfff>Latence <#a89ab5>» <#59a4ff>%latency%'
    - ' <#a89ab5>▎ <#e7cfff>Récompenses en cours <#a89ab5>» <#59a4ff>%rewards%'
    - ' <#a89ab5>▎ <#e7cfff>Dernière erreur <#a89ab5>» <#868e96>%error%'
    - '&r'
  state-connected: '<#8fffc1>Connecté'
  state-connecting: '<#ff9500>Connexion…'
  state-not-linked: '<#868e96>Non lié'
  state-stopped: '<#a33b53>Mettez ExyliaLink à jour'
  role-proxy: '<#59a4ff>Proxy <#868e96>(parle aux joueurs)'
  role-backend: '<#59a4ff>Serveur de jeu'
  role-backend-behind-proxy: '<#59a4ff>Serveur de jeu <#868e96>(le proxy parle aux joueurs)'
  none: '—'
  disconnect-confirm:
    - '%prefix% <#e7cfff>Déconnecter <#ffd700>ce serveur <#e7cfff>d''Exylia Link ? <#868e96>(les autres restent connectés)'
    - '<click:run_command:/linkadmin disconnect confirm><hover:show_text:''<#e7cfff>Déconnecter maintenant''><#a33b53>&l[✔ DÉCONNECTER]</hover></click> <#a89ab5>Vous avez <#59a4ff>30s ⌚ <#a89ab5>pour confirmer.'
  disconnected: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Déconnecté. <#e7cfff>network.dat a été supprimé sur ce serveur.'
  not-connected: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Ce serveur n''est pas connecté. Tapez <#59a4ff>/linkadmin connect<#e7cfff>.'
  unlink-done: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1><#ffd700>%player%<#8fffc1> a été délié.'
  unlink-none: '[sound:entity.villager.no|0.6|1.0]%prefix% <#ffd700>%player% <#e7cfff>n''était pas lié.'
  player-not-found: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Aucun joueur nommé <#ffd700>%player%<#a33b53>.'
  secret-revoked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Exylia Link a révoqué le secret de ce réseau. <#e7cfff>Tapez <#59a4ff>/linkadmin connect <#e7cfff>pour le relier.'
  protocol-refused: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Exylia Link n''accepte plus cette version d''ExyliaLink. <#e7cfff>Mettez le plugin à jour.'
  reloaded: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>config.yml et les messages ont été rechargés.'
  reload-failed: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Rechargement impossible : <#868e96>%error%'
importing:
  running: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Un import est déjà en cours.'
  none: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Aucun lien DiscordSRV trouvé <#868e96>(ni DiscordSRV actif, ni accounts.aof, ni stockage SQL)<#e7cfff>.'
