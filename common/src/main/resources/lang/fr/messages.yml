  done:
    - '&r'
    - '[sound:entity.experience_orb.pickup|0.6|1.4;center]<#8a51c4>&lIMPORT DISCORDSRV TERMINÉ'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Liens lus <#a89ab5>» <#59a4ff>%total%'
    - ' <#a89ab5>▎ <#e7cfff>Importés <#a89ab5>» <#8fffc1>%inserted%'
    - ' <#a89ab5>▎ <#e7cfff>Déjà liés <#a89ab5>» <#868e96>%skipped%'
    - ' <#a89ab5>▎ <#e7cfff>Conflits <#a89ab5>» <#ff9500>%conflicts%'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Les conflits sont listés sur le tableau de bord et dans la console'
