  available: '%prefix% <#e7cfff>ExyliaLink <#8fffc1>%version% <#e7cfff>est disponible <#868e96>(version actuelle %current%)<#e7cfff>. <click:open_url:%url%><hover:show_text:''<#e7cfff>Ouvrir la page de la version''><#59a4ff>&nTélécharger</hover></click>'
