  backend-only: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>DiscordSRV tourne sur les serveurs de jeu : exécutez ceci sur le serveur qui l''a.'
requirements:
  reason: 'Votre grade exige un compte Discord lié.'
