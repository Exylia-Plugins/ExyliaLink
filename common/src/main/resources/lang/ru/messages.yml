    - ' <#a89ab5>▎ <#e7cfff>или укажите его на <click:open_url:%url%><hover:show_text:''<#e7cfff>Открыть страницу привязки''><#59a4ff>%url%</hover></click>'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Истекает через <#59a4ff>%time% ⌚'
    - '&r'
  redeemed: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Привязано к <#ffd700>%discord%<#8fffc1>. Добро пожаловать!'
  linked: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Ваш аккаунт теперь привязан к <#ffd700>%discord%<#8fffc1>.'
  unlinked: '[sound:block.note_block.bass|0.5|0.8]%prefix% <#e7cfff>Ваш аккаунт больше не привязан к Discord.'
  status-linked:
    - '&r'
    - '[center]<#8a51c4>&lПРИВЯЗКА DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Статус <#a89ab5>» <#8fffc1>Привязан'
    - ' <#a89ab5>▎ <#e7cfff>Discord <#a89ab5>» <#ffd700>%discord%'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Введите <#59a4ff>/unlink<#e7cfff>, чтобы отвязать'
    - '&r'
  status-unlinked:
    - '&r'
    - '[center]<#8a51c4>&lПРИВЯЗКА DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Статус <#a89ab5>» <#868e96>Не привязан'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Введите <#59a4ff>/link<#e7cfff>, чтобы получить код'
    - '&r'
  unlink-confirm:
    - '%prefix% <#e7cfff>Отвязать аккаунт от <#ffd700>%discord%<#e7cfff>?'
    - '<click:run_command:/unlink confirm><hover:show_text:''<#e7cfff>Отвязать сейчас''><#a33b53>&l[✔ ОТВЯЗАТЬ]</hover></click> <#a89ab5>У вас есть <#59a4ff>30 с ⌚ <#a89ab5>на подтверждение.'
  unlink-done: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Ваш аккаунт больше не привязан.'
  not-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Ваш аккаунт не привязан. Введите <#59a4ff>/link<#e7cfff>, чтобы привязать.'
errors:
  offline: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Привязка Discord сейчас недоступна. <#e7cfff>Попробуйте чуть позже.'
  rate-limited: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Не так быстро, повторите через <#59a4ff>%time% ⌚<#e7cfff>.'
  cooldown: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Привязать снова можно через <#59a4ff>%time% ⌚<#e7cfff>.'
  already-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Вы уже привязаны. Сначала введите <#59a4ff>/unlink<#e7cfff>.'
  uuid-taken: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Вы уже привязаны. Сначала введите <#59a4ff>/unlink<#e7cfff>.'
  discord-taken: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Этот аккаунт Discord уже привязан <#e7cfff>к другому аккаунту Minecraft.'
  code-invalid: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Код недействителен. <#e7cfff>Введите <#59a4ff>/link <#e7cfff>в Discord, чтобы получить новый.'
  self-unlink-disabled: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Отвязка отключена в этой сети. Обратитесь к персоналу.'
  internal: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Что-то пошло не так <#868e96>(%error%)<#a33b53>. <#e7cfff>Попробуйте позже.'
  players-only: '%prefix% <#e7cfff>Это могут делать только игроки.'
  no-permission: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>У вас нет прав на это действие.'
admin:
  usage:
    - '&r'
    - '[center]<#8a51c4>&lEXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin connect <#a89ab5>» <#e7cfff>подключить сеть'
