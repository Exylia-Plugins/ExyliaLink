prefix: '{primary}&lLINK {letters_black}•<reset>'
link:
  code:
    - '&r'
    - '[center]<#8a51c4>&lПРИВЯЖИТЕ DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Ваш код <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Нажмите, чтобы скопировать''><#ffd700>&l%code%</hover></click> <#868e96>(нажмите, чтобы скопировать)'
