    - ' <#a89ab5>▎ <#59a4ff>/linkadmin unlink <player> <#a89ab5>» <#e7cfff>отвязать игрока'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin import discordsrv <#a89ab5>» <#e7cfff>импорт привязок DiscordSRV'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin reload <#a89ab5>» <#e7cfff>перезагрузить файлы'
