  status-unlinked:
    - '&r'
    - '[center]<#8a51c4>&lVÍNCULO CON DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Estado <#a89ab5>» <#868e96>Sin vincular'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Usa <#59a4ff>/link <#e7cfff>para obtener un código'
    - '&r'
  unlink-confirm:
    - '%prefix% <#e7cfff>¿Desvincular tu cuenta de <#ffd700>%discord%<#e7cfff>?'
