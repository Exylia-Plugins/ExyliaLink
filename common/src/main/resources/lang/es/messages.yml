prefix: '<#8a51c4>&lEXYLIA LINK <#a89ab5>•<reset>'
link:
  code:
    - '&r'
    - '[center]<#8a51c4>&lVINCULA TU DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Tu código <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Clic para copiar''><#ffd700>&l%code%</hover></click> <#868e96>(clic para copiar)'
