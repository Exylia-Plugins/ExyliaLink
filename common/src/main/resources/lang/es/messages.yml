  unlinked: '[sound:block.note_block.bass|0.5|0.8]%prefix% <#e7cfff>Tu cuenta ya no está vinculada a Discord.'
  status-linked:
    - '&r'
    - '[center]<#8a51c4>&lVÍNCULO CON DISCORD'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Estado <#a89ab5>» <#8fffc1>Vinculado'
    - ' <#a89ab5>▎ <#e7cfff>Discord <#a89ab5>» <#ffd700>%discord%'
    - '&r'
    - '<#ff9500>➥ <#e7cfff>Usa <#59a4ff>/unlink <#e7cfff>para quitarlo'
