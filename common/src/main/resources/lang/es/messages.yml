  secret-revoked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Exylia Link revocó el secreto de esta red. <#e7cfff>Usa <#59a4ff>/linkadmin connect <#e7cfff>para vincularla de nuevo.'
  protocol-refused: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>Exylia Link ya no acepta esta versión de ExyliaLink. <#e7cfff>Actualiza el plugin.'
