  unlink-done: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Tu cuenta ya no está vinculada.'
  not-linked: '[sound:entity.villager.no|0.6|1.0]%prefix% <#e7cfff>Tu cuenta no está vinculada. Usa <#59a4ff>/link <#e7cfff>para vincularla.'
errors:
