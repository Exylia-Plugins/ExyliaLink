  no-permission: '[sound:entity.villager.no|0.6|1.0]%prefix% <#a33b53>No tienes permiso para hacer eso.'
admin:
  usage:
    - '&r'
    - '[center]<#8a51c4>&lEXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin connect <#a89ab5>» <#e7cfff>vincular la red'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin status <#a89ab5>» <#e7cfff>conexión y red'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin disconnect <#a89ab5>» <#e7cfff>olvidar la red aquí'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin unlink <jugador> <#a89ab5>» <#e7cfff>desvincular a alguien'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin import discordsrv <#a89ab5>» <#e7cfff>traer los vínculos de DiscordSRV'
    - ' <#a89ab5>▎ <#59a4ff>/linkadmin reload <#a89ab5>» <#e7cfff>recargar los archivos'
    - '&r'
  connect-code:
    - '&r'
    - '[center]<#8a51c4>&lCONECTAR CON EXYLIA LINK'
    - '&r'
    - ' <#a89ab5>▎ <#e7cfff>Código <#a89ab5>» <click:copy_to_clipboard:%code%><hover:show_text:''<#e7cfff>Clic para copiar''><#ffd700>&l%code%</hover></click>'
