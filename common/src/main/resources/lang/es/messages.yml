    - ' <#a89ab5>▎ <#e7cfff>Caduca en <#59a4ff>%time% ⌚'
    - '&r'
  redeemed: '[sound:entity.experience_orb.pickup|0.6|1.4]%prefix% <#8fffc1>Vinculado a <#ffd700>%discord%<#8fffc1>. ¡Bienvenido!'
