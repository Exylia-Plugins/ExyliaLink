// No platform on the classpath, on purpose: the protocol, the stores and every decision are
// tested without a server or a proxy. Gson and SnakeYAML ship with Paper, Spigot, BungeeCord and
// Velocity, so they are compileOnly; so is the LuckPerms API (a soft dependency everywhere) and
// BungeeCord's chat API, which Paper, Spigot and BungeeCord share.
dependencies {
    compileOnly 'com.google.code.gson:gson:2.8.9'
    compileOnly 'org.yaml:snakeyaml:1.33'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'net.md-5:bungeecord-chat:1.20-R0.2'
    testImplementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.yaml:snakeyaml:1.33'
}

processResources {
    filteringCharset = 'UTF-8'
}

// The plugin reports its own version, and this is the one place the build version reaches the code.
def constantsDir = layout.buildDirectory.dir('generated/sources/constants/java/main')
def generateConstants = tasks.register('generateBuildConstants') {
    inputs.property('version', project.version)
    outputs.dir(constantsDir)
    doLast {
        def file = constantsDir.get().file('net/exylia/link/BuildConstants.java').asFile
        file.parentFile.mkdirs()
        file.text = """package net.exylia.link;

/** Generated by Gradle; the version is the one in build.gradle. */
public final class BuildConstants {
    public static final String VERSION = "${project.version}";

    private BuildConstants() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateConstants.map { constantsDir })
