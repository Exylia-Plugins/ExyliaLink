// One jar for every platform: Paper, Spigot and Folia read plugin.yml, BungeeCord and Waterfall
// bungee.yml, Velocity velocity-plugin.json. Each loads only its own module's main class, so the
// classes of the other platforms sit in the jar untouched.
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.11'
}

allprojects {
    group = 'net.exylia'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        // BungeeCord's API snapshots.
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url = 'https://repo.extendedclip.com/releases/' }
        // DiscordSRV's API, for /linkadmin import discordsrv; never shaded.
        maven {
            url = 'https://nexus.scarsz.me/content/groups/public/'
            content { includeGroup('com.discordsrv') }
        }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    // Java 17 bytecode: the oldest runtime Paper 1.17, BungeeCord and Velocity 3 servers run on.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(17)
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.0.2'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}

dependencies {
    implementation project(':paper')
    implementation project(':velocity')
    implementation project(':bungee')
}

shadowJar {
    archiveBaseName.set('ExyliaLink')
    archiveClassifier.set('')
    // Set exyliaOutputDir in ~/.gradle/gradle.properties to drop the jar straight into a server.
    if (project.hasProperty('exyliaOutputDir')) {
        destinationDirectory = file("${exyliaOutputDir}/plugins")
    }
    exclude 'META-INF/maven/**', 'META-INF/versions/**'
}

tasks.named('build') { dependsOn shadowJar }

// The plain jar keeps its own name, so build/libs holds one ExyliaLink-<version>.jar: the one to install.
jar {
    archiveClassifier.set('plain')
}
