name: ExyliaLink
version: '${version}'
main: net.exylia.exyliaLink.ExyliaLink
api-version: '1.21'
authors: [ DiGround ]
website: https://link.exylia.net
description: Links Minecraft accounts to Discord through Exylia Link.

# The oldest ExyliaLib this build runs on.
exylia-lib: '${exyliaLibVersion}'

folia-supported: true

depend:
  - ExyliaLib
softdepend:
  - LuckPerms
  - PlaceholderAPI
  - DiscordSRV

permissions:
  exylialink.link:
    description: Use /link and /unlink.
    default: true
  exylialink.admin:
    description: Connect the network, unlink other players, import DiscordSRV links and change the settings.
    default: op
  exylialink.requirements.bypass:
    description: Never warned or restricted by the network's linked-account requirements.
    default: false

libraries:
  # The same list ExyliaLib declares, in the same order and the same versions.
  - 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
  - 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
  - 'com.github.ben-manes.caffeine:caffeine:3.2.4'
  - 'com.zaxxer:HikariCP:5.1.0'
  - 'com.h2database:h2:2.2.224'
  - 'com.mysql:mysql-connector-j:8.4.0'
  - 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
  - 'org.postgresql:postgresql:42.7.4'
  - 'org.mongodb:mongodb-driver-sync:4.11.1'
  - 'redis.clients:jedis:5.1.0'
  - 'org.apache.commons:commons-pool2:2.12.0'
