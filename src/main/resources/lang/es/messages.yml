prefix: '{primary}&lEXYLIA LINK {letters_black}•<reset>'
link:
  code:
    - '&r'
    - '[center]{primary}&lVINCULA TU DISCORD'
    - '&r'
    - ' {letters_black}▎ {letters}Tu código {letters_black}» <click:copy_to_clipboard:%code%><hover:show_text:''{letters}Clic para copiar''>{highlight}&l%code%</hover></click> {muted}(clic para copiar)'
    - ' {letters_black}▎ {letters}Usa {info}/link %code% {letters}en nuestro Discord'
    - ' {letters_black}▎ {letters}o introdúcelo en <click:open_url:%url%><hover:show_text:''{letters}Abrir la página''>{info}%url%</hover></click>'
    - '&r'
    - ' {letters_black}▎ {letters}Caduca en {info}%time% ⌚'
    - '&r'
  redeemed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4]%prefix% {success}Vinculado a {highlight}%discord%{success}. ¡Bienvenido!'
  linked: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4]%prefix% {success}Tu cuenta ahora está vinculada a {highlight}%discord%{success}.'
  unlinked: '[sound:BLOCK_NOTE_BLOCK_BASS|0.5|0.8]%prefix% {letters}Tu cuenta ya no está vinculada a Discord.'
  status-linked:
    - '&r'
    - '[center]{primary}&lVÍNCULO CON DISCORD'
    - '&r'
    - ' {letters_black}▎ {letters}Estado {letters_black}» {success}Vinculado'
    - ' {letters_black}▎ {letters}Discord {letters_black}» {highlight}%discord%'
    - '&r'
    - '{warning}➥ {letters}Usa {info}/unlink {letters}para quitarlo'
    - '&r'
  status-unlinked:
    - '&r'
    - '[center]{primary}&lVÍNCULO CON DISCORD'
    - '&r'
    - ' {letters_black}▎ {letters}Estado {letters_black}» {muted}Sin vincular'
    - '&r'
    - '{warning}➥ {letters}Usa {info}/link {letters}para obtener un código'
    - '&r'
  unlink-confirm: '{letters}¿Desvincular tu cuenta de {highlight}%discord%{letters}?'
  unlink-done: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4]%prefix% {success}Tu cuenta ya no está vinculada.'
  not-linked: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Tu cuenta no está vinculada. Usa {info}/link {letters}para vincularla.'
errors:
  offline: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}La vinculación con Discord no está disponible ahora. {letters}Inténtalo de nuevo en un momento.'
  rate-limited: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Más despacio, inténtalo de nuevo en {info}%time% ⌚{letters}.'
  cooldown: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Podrás vincular de nuevo en {info}%time% ⌚{letters}.'
  already-linked: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Ya estás vinculado. Usa {info}/unlink {letters}primero.'
  uuid-taken: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Ya estás vinculado. Usa {info}/unlink {letters}primero.'
  discord-taken: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}Esa cuenta de Discord ya está vinculada {letters}a otra cuenta de Minecraft.'
  code-invalid: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}Ese código no es válido. {letters}Usa {info}/link {letters}en Discord para obtener otro.'
  self-unlink-disabled: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Desvincular está desactivado en esta red. Pídeselo a un miembro del staff.'
  internal: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}Algo salió mal {muted}(%error%){error}. {letters}Inténtalo más tarde.'
admin:
  connect-code:
    - '&r'
    - '[center]{primary}&lCONECTAR CON EXYLIA LINK'
    - '&r'
    - ' {letters_black}▎ {letters}Código {letters_black}» <click:copy_to_clipboard:%code%><hover:show_text:''{letters}Clic para copiar''>{highlight}&l%code%</hover></click>'
    - ' {letters_black}▎ {letters}Apruébalo en <click:open_url:%url%><hover:show_text:''{letters}Abrir la página de aprobación''>{info}%url%</hover></click>'
    - ' {letters_black}▎ {letters}Caduca en {info}%time% ⌚'
    - '&r'
    - '{warning}➥ {letters}Inicia sesión con Discord, elige la red y aprueba'
    - '&r'
  connect-waiting: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Ya hay un código de conexión esperando aprobación.'
  connect-done: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4]%prefix% {success}Conectado a {highlight}%network%{success}. Todos los servidores de la red lo detectan en 30s.'
  connect-expired: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}El código caducó. Usa {info}/linkadmin connect {letters}de nuevo.'
  connect-failed: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}No se pudo contactar con Exylia Link. {letters}Inténtalo de nuevo en un momento.'
  status:
    - '&r'
    - '[center]{primary}&lEXYLIA LINK'
    - '&r'
    - ' {letters_black}▎ {letters}Conexión {letters_black}» %state%'
    - ' {letters_black}▎ {letters}Red {letters_black}» {highlight}%network%'
    - ' {letters_black}▎ {letters}ID del servidor {letters_black}» {info}%server%'
    - ' {letters_black}▎ {letters}Latencia {letters_black}» {info}%latency%'
    - ' {letters_black}▎ {letters}Recompensas en curso {letters_black}» {info}%rewards%'
    - ' {letters_black}▎ {letters}Último error {letters_black}» {muted}%error%'
    - '&r'
  state-connected: '{success}Conectado'
  state-connecting: '{warning}Conectando…'
  state-not-linked: '{muted}Sin vincular'
  state-stopped: '{error}Actualiza ExyliaLink'
  none: '—'
  disconnect-confirm: '{letters}¿Desconectar {highlight}todos los servidores {letters}de esta red de Exylia Link?'
  disconnected: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4]%prefix% {success}Desconectado. {letters}Todos los servidores sueltan el vínculo en 30s.'
  not-connected: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Esta red no está conectada. Usa {info}/linkadmin connect{letters}.'
  unlink-done: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4]%prefix% {success}{highlight}%player% {success}desvinculado.'
  unlink-none: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {highlight}%player% {letters}no estaba vinculado.'
  player-not-found: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}No hay ningún jugador llamado {highlight}%player%{error}.'
  secret-revoked: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}Exylia Link revocó el secreto de esta red. {letters}Usa {info}/linkadmin connect {letters}para vincularla de nuevo.'
  protocol-refused: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}Exylia Link ya no acepta esta versión de ExyliaLink. {letters}Actualiza el plugin.'
importing:
  running: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}Ya hay una importación en curso.'
  none: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {letters}No se encontraron vínculos de DiscordSRV {muted}(ni DiscordSRV activo, ni accounts.aof, ni almacenamiento SQL){letters}.'
  unreadable: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}No se pudieron leer los vínculos de DiscordSRV: {muted}%error%'
  started: '%prefix% {letters}Importando {info}%total% {letters}vínculos desde {highlight}%source%{letters}…'
  progress: '%prefix% {letters}Importación {info}%sent%{letters_black}/{info}%total% {letters_black}» {success}%inserted% nuevos {letters_black}· {muted}%skipped% omitidos {letters_black}· {warning}%conflicts% conflictos'
  done:
    - '&r'
    - '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.4;center]{primary}&lIMPORTACIÓN DE DISCORDSRV TERMINADA'
    - '&r'
    - ' {letters_black}▎ {letters}Vínculos leídos {letters_black}» {info}%total%'
    - ' {letters_black}▎ {letters}Importados {letters_black}» {success}%inserted%'
    - ' {letters_black}▎ {letters}Ya vinculados {letters_black}» {muted}%skipped%'
    - ' {letters_black}▎ {letters}Conflictos {letters_black}» {warning}%conflicts%'
    - '&r'
    - '{warning}➥ {letters}Los conflictos aparecen en el panel y en la consola'
    - '&r'
  failed: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}La importación se detuvo en {info}%sent%{letters_black}/{info}%total% {muted}(%error%){error}. {letters}Volver a ejecutarla es seguro.'
requirements:
  reason: Tu rango requiere una cuenta de Discord vinculada.
  warning:
    - '&r'
    - '[sound:BLOCK_NOTE_BLOCK_PLING|0.5|1.2;center]{primary}&lVINCULACIÓN OBLIGATORIA'
    - '&r'
    - ' {letters_black}▎ {letters}%reason%'
    - '&r'
    - '<click:run_command:/link><hover:show_text:''{letters}Clic para obtener tu código''>{warning}➥ {letters}Haz clic aquí o usa {info}/link {letters}para vincular tu Discord</hover></click>'
    - '&r'
  warning-restricted:
    - '&r'
    - '[sound:BLOCK_NOTE_BLOCK_PLING|0.5|1.2;center]{primary}&lVINCULACIÓN OBLIGATORIA'
    - '&r'
    - ' {letters_black}▎ {letters}%reason%'
    - ' {letters_black}▎ {letters}Algunos comandos seguirán {error}bloqueados {letters}hasta que vincules.'
    - '&r'
    - '<click:run_command:/link><hover:show_text:''{letters}Clic para obtener tu código''>{warning}➥ {letters}Haz clic aquí o usa {info}/link {letters}para vincular tu Discord</hover></click>'
    - '&r'
  reminder: '%prefix% {letters}%reason% <click:run_command:/link><hover:show_text:''{letters}Clic para obtener tu código''>{info}&n/link</hover></click>'
  blocked: '[sound:ENTITY_VILLAGER_NO|0.6|1.0]%prefix% {error}Vincula primero tu cuenta de Discord. <click:run_command:/link><hover:show_text:''{letters}Clic para obtener tu código''>{letters}Usa {info}/link {letters}para desbloquear este comando.</hover></click>'
